<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home — Directory</title>
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/account.css">
</head>
<body>
    <div class="container">
        <nav class="nav">
            <div class="nav-brand">
                <a id="nav-logo-link" href="#"><img src="assets/improving-logo-simple.png" alt="Improving" class="nav-brand-logo"></a>
                <span class="nav-brand-sep"></span>
                <span class="nav-brand-app">Directory</span>
            </div>
            <div class="nav-right">
                <a href="#" class="btn-user">
                    <div class="btn-user-avatar">AD</div>
                    Austin Dircks
                </a>
                <a id="nav-signout-link" href="#" class="btn-signout">Sign out</a>
            </div>
        </nav>

        <div class="welcome">
            <div class="welcome-title">Consultant Directory</div>
            <p class="welcome-sub">Find and explore Improving consultants.</p>
        </div>

        <div class="directory-controls">
            <input type="text" id="search-input" class="search-input" placeholder="Search by name...">
            <div class="filter-group">
                <select id="filter-location" class="filter-select">
                    <option value="">All Locations</option>
                </select>
                <select id="filter-title" class="filter-select">
                    <option value="">All Titles</option>
                </select>
            </div>
        </div>

        <div class="directory">
            <div class="directory-header">
                <span>Name</span>
                <span>Location</span>
                <span>Title</span>
            </div>
            <div id="consultant-list" class="directory-list"></div>
        </div>
    </div>

    <script>
        let PORTAL_BASE = 'http://localhost:3001';

        async function loadConfig() {
            const res = await fetch('/api/config');
            const config = await res.json();
            PORTAL_BASE = config.portalUrl;
        }

        let activeRow = null;
        let rowIndex = [];

        function getInitials(name) {
            const parts = name.trim().split(' ');
            return (parts[0][0] + (parts[parts.length - 1][0] || '')).toUpperCase();
        }

        function getAvatarColor(name) {
            const colors = ['#005596', '#0077cc', '#2e7d32', '#6a1b9a', '#c62828', '#e65100', '#00695c', '#1565c0'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        }

        function applyFilters() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const location = document.getElementById('filter-location').value;
            const title = document.getElementById('filter-title').value;

            if (activeRow) {
                activeRow.classList.remove('is-open');
                activeRow.closest('.directory-row-wrap').querySelector('.directory-row').classList.remove('is-active');
                activeRow = null;
            }

            for (const { consultant, wrap } of rowIndex) {
                const nameLower = consultant.name.toLowerCase();
                const consultantLocation = `${consultant.city}, ${consultant.state}`;
                const matchesSearch = !query || nameLower.includes(query);
                const matchesLocation = !location || consultantLocation === location;
                const matchesTitle = !title || consultant.title === title;
                wrap.style.display = matchesSearch && matchesLocation && matchesTitle ? '' : 'none';
            }
        }

        async function loadConsultants() {
            const list = document.getElementById('consultant-list');
            list.innerHTML = '';
            rowIndex = [];
            activeRow = null;

            const locationSelect = document.getElementById('filter-location');
            const titleSelect = document.getElementById('filter-title');
            locationSelect.innerHTML = '<option value="">All Locations</option>';
            titleSelect.innerHTML = '<option value="">All Titles</option>';

            const res = await fetch('/api/consultants');
            if (res.status === 401) { window.location.href = '/auth/portal'; return; }
            const consultants = await res.json();

            const locations = [...new Set(consultants.map(c => `${c.city}, ${c.state}`))].sort();
            const titles = [...new Set(consultants.map(c => c.title))].sort();

            for (const loc of locations) {
                const opt = document.createElement('option');
                opt.value = loc;
                opt.textContent = loc;
                locationSelect.appendChild(opt);
            }

            for (const t of titles) {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                titleSelect.appendChild(opt);
            }

            for (const consultant of consultants) {
                const row = document.createElement('div');
                row.className = 'directory-row';
                row.dataset.id = consultant.id;
                row.innerHTML = `
                    <span class="directory-name">${consultant.name}</span>
                    <span class="directory-city">${consultant.city}, ${consultant.state}</span>
                    <span class="directory-role">${consultant.title}</span>
                `;

                const detail = document.createElement('div');
                detail.className = 'directory-detail';
                detail.innerHTML = `
                    <div class="detail-avatar" style="background:${getAvatarColor(consultant.name)}">${getInitials(consultant.name)}</div>
                    <div class="detail-info">
                        <div class="detail-name">${consultant.name}</div>
                        <div class="detail-title">${consultant.title}</div>
                        <div class="detail-fields">
                            <div class="detail-field">
                                <span class="detail-label">Role</span>
                                <span class="detail-value">${consultant.role_type}</span>
                            </div>
                            <div class="detail-field">
                                <span class="detail-label">Location</span>
                                <span class="detail-value">${consultant.city}, ${consultant.state}</span>
                            </div>
                            <div class="detail-field">
                                <span class="detail-label">Phone</span>
                                <span class="detail-value">${consultant.phone}</span>
                            </div>
                            <div class="detail-field">
                                <span class="detail-label">Client History</span>
                                <span class="detail-value detail-empty">None on record</span>
                            </div>
                        </div>
                    </div>
                `;

                row.addEventListener('click', () => {
                    const isOpen = detail.classList.contains('is-open');

                    if (activeRow && activeRow !== detail) {
                        activeRow.classList.remove('is-open');
                        activeRow.closest('.directory-row-wrap').querySelector('.directory-row').classList.remove('is-active');
                    }

                    detail.classList.toggle('is-open', !isOpen);
                    row.classList.toggle('is-active', !isOpen);
                    activeRow = isOpen ? null : detail;
                });

                const wrap = document.createElement('div');
                wrap.className = 'directory-row-wrap';
                wrap.appendChild(row);
                wrap.appendChild(detail);
                list.appendChild(wrap);

                rowIndex.push({ consultant, wrap });
            }
        }

        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('filter-location').addEventListener('change', applyFilters);
        document.getElementById('filter-title').addEventListener('change', applyFilters);

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                loadConsultants();
            }
        });

        async function init() {
            await loadConfig();
            document.getElementById('nav-logo-link').href = PORTAL_BASE + '/portal';
            document.getElementById('nav-signout-link').href = PORTAL_BASE + '/';
            await loadConsultants();
        }

        init();
    </script>
</body>
</html>
