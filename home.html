<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home — Directory</title>
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/account.css">
</head>
<body>
    <div class="container">
        <nav class="nav">
            <div class="nav-brand">
                <img src="assets/improving-logo-simple.png" alt="Improving" class="nav-brand-logo">
                <span class="nav-brand-sep"></span>
                <span class="nav-brand-app">Directory</span>
            </div>
            <div class="nav-right">
                <a href="#" class="btn-user">
                    <div class="btn-user-avatar">AD</div>
                    Austin Dircks
                </a>
                <a href="http://localhost:3001" class="btn-signout">Sign out</a>
            </div>
        </nav>

        <div class="welcome">
            <div class="welcome-title">Consultant Directory</div>
            <p class="welcome-sub">Find and explore Improving consultants.</p>
        </div>

        <div class="directory">
            <div class="directory-header">
                <span>Name</span>
                <span>City</span>
                <span>Role</span>
            </div>
            <div id="consultant-list" class="directory-list"></div>
        </div>
    </div>

    <script>
        async function loadConsultants() {
            const list = document.getElementById('consultant-list');
            const consultants = await fetch('/api/consultants').then(r => r.json());

            for (const consultant of consultants) {
                const row = document.createElement('div');
                row.className = 'directory-row';
                row.innerHTML = `
                    <span class="directory-name">${consultant.name}</span>
                    <span class="directory-city">${consultant.city}</span>
                    <span class="directory-role">${consultant.role_type}</span>
                `;
                row.addEventListener('click', () => openContactCard(consultant));
                list.appendChild(row);
            }
        }

        function openContactCard(consultant) {
            // contact card — tracked in future issue
        }

        loadConsultants();
    </script>
</body>
</html>
